:root{
  --bg:#F3F1EC; --ink:#141414; --muted:#8A857C;
  --board:#0F0F0F; --tile:#1C1C1C; --tile2:#232323; --flap:#F1EFEA;
  --amber:#F2A33A; --green:#58C98B; --dim:#6F6F6F; --red:#E5484D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);
  font-family:"FaroSans",-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}

/* header */
.top{position:absolute;left:96px;right:96px;top:72px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:22px}
.brand img{width:64px;height:64px}
.title{font-family:"Faro",sans-serif;font-size:56px;line-height:1;letter-spacing:.5px}
.meta{font-size:24px;color:var(--muted);text-align:right;line-height:1.4}
.meta b{font-family:"Flap",monospace;font-weight:400;color:var(--ink);letter-spacing:1px}

/* board */
.boardwrap{position:absolute;left:96px;right:96px;top:170px;height:700px;display:flex;align-items:center;justify-content:center}
.board{position:relative;background:var(--board);border-radius:28px;padding:44px 52px 52px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.18)}
.labels{position:relative;height:34px;margin-bottom:14px}
.labels span{position:absolute;top:0;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:#7C7C7C}
.row{display:flex;margin-top:9px}
.row:first-of-type{margin-top:0}
.tile{position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(var(--tile2) 0 50%, var(--tile) 50% 100%);border-radius:6px;margin-right:4px;
  font-family:"Flap",monospace;color:var(--flap);overflow:hidden}
.tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.75)}
.tile.gap{background:transparent}
.tile.gap::after{display:none}
.tile span{display:block;transform-origin:50% 50%;line-height:1}
.tile.flip span{animation:flap .07s linear}
@keyframes flap{0%{transform:scaleY(1)}50%{transform:scaleY(.12)}100%{transform:scaleY(1)}}
.c-amber{color:var(--amber)} .c-red{color:var(--red)} .c-green{color:var(--green)} .c-dim{color:var(--dim)}

.beam{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent 0%,transparent 40%,rgba(255,236,200,.16) 50%,transparent 60%,transparent 100%);
  background-size:250% 100%;background-position:120% 0}
.beam.go{animation:beam 1.8s ease-in-out}
@keyframes beam{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-30% 0}}

/* caption */
.caption{position:absolute;left:96px;right:96px;bottom:96px;text-align:center}
.caption .big{font-size:46px;font-weight:500;letter-spacing:-.3px;transition:opacity .35s}
.caption .small{margin-top:14px;font-size:24px;color:var(--muted)}
.tagline{font-family:"Faro",sans-serif;font-size:64px}

.fade{opacity:0}
.progress{position:absolute;left:96px;bottom:40px;display:flex;gap:8px}
.progress i{width:28px;height:4px;border-radius:2px;background:#D9D5CC}
.progress i.on{background:var(--ink)}

#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:rgba(20,20,20,.94);color:#eee;
  font:18px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:20px 28px;display:none;z-index:9}
#notes b{color:var(--amber)}
#help{position:fixed;right:14px;bottom:10px;font:12px -apple-system,Arial,sans-serif;color:#A8A39A;z-index:8}
</style>

   steps:[{rows:[["FARO",{t:"LIVE",c:GREEN},"NOW BOARDING ▸"]], cap:"Let's look at it live.", small:""}],
   notes:`<b>1:20–1:30</b> “Let's look at it live.” <b>→ switch to Faro.</b><br><b>Demo:</b> issue list → I-1: scan vs goods receipt, 80,000 vs 8,000 → A-2 approved → posted to SAP (REC-261121-0001) → I-7: Faro flagged the unapproved EXW switch on a USD 393,000 order → the rule: nothing leaves the building without a human.`},
 { title:"faro", cols:COLS1, meta:"shift", closing:true,
   steps:[{rows:dep([{t:"ON TIME",c:GREEN},{t:"ON TIME",c:GREEN}]), beam:true, cap:"", small:"", tagline:"sees the problem before the dock does.", small:"And keeps the line running when every hour counts."}],
   notes:`<b>2:50–3:00 · closing</b> “Faro. It sees the problem before the dock does — and keeps the line running when every hour counts.”`},
];

/* ---------- board engine ---------- */
const CHARSET="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-/€.";
const BOARD_W=1700;
let cur=0, step=0, cells=[], timers=[], cycleTimer=null, sound=false, actx=null;

function norm(seg){ return typeof seg==="object" ? seg : {t:seg, c:""}; }
function pad(s,w){ s=String(s).toUpperCase(); return (s+" ".repeat(w)).slice(0,w); }

function build(cols, nrows){
  const total = cols.reduce((a,c)=>a+c.w,0) + (cols.length-1);
  const twW = Math.floor((BOARD_W-104)/total) - 4;
  const twH = Math.floor(((640 - 48)/nrows - 9)/1.32);
  const tw = Math.min(64, twW, twH);
  const th = Math.round(tw*(nrows>6?1.32:1.42)), fs=Math.round(tw*0.8);
  const rowsEl=document.getElementById("rows"), labEl=document.getElementById("labels");
  rowsEl.innerHTML=""; labEl.innerHTML=""; cells=[];
  let x=0; const hasLabels = cols.some(c=>c.l);
  labEl.style.display = hasLabels ? "block" : "none";
  cols.forEach((c,ci)=>{ if(c.l){ const s=document.createElement("span"); s.textContent=c.l; s.style.left=x+"px"; labEl.appendChild(s);} x += (c.w+1)*(tw+4); });
  for(let r=0;r<nrows;r++){
    const row=document.createElement("div"); row.className="row"; const rc=[];
    cols.forEach((c,ci)=>{
      const seg=[];
      for(let k=0;k<c.w;k++){ const t=mk(tw,th,fs); row.appendChild(t); seg.push(t); }
      rc.push(seg);
      if(ci<cols.length-1){ const g=mk(tw,th,fs); g.classList.add("gap"); row.appendChild(g); }
    });
    rowsEl.appendChild(row); cells.push(rc);
  }
}
function mk(tw,th,fs){ const d=document.createElement("div"); d.className="tile"; d.style.width=tw+"px"; d.style.height=th+"px"; d.style.fontSize=fs+"px"; d.innerHTML="<span> </span>"; return d; }

function setTile(t,ch,color){
  const sp=t.firstChild; sp.textContent=ch; t.className="tile"+(color?" c-"+color:"");
  void t.offsetWidth; t.classList.add("flip");
}
function flipTo(t,target,color,delay,animate){
  const curCh=t.firstChild.textContent, curColor=(t.className.match(/c-(\w+)/)||[])[1]||"";
  if(curCh===target && curColor===color) return;
  if(!animate){ t.firstChild.textContent=target; t.className="tile"+(color?" c-"+color:""); return; }
  const n = 3 + Math.floor(Math.random()*5);
  for(let i=0;i<n;i++){
    timers.push(setTimeout(()=>setTile(t, CHARSET[Math.floor(Math.random()*CHARSET.length)], ""), delay+i*70));
  }
  timers.push(setTimeout(()=>{ setTile(t,target,color); click(); }, delay+n*70));
}
function render(rows, cols, animate){
  rows.forEach((r,ri)=>{
    r.forEach((seg,si)=>{
      const s=norm(seg), txt=pad(s.t, cols[si].w);
      cells[ri][si].forEach((t,k)=>flipTo(t, txt[k], s.c||"", ri*90 + si*40 + k*22 + Math.random()*60, animate));
    });
  });
}

function click(){
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const b=actx.createBuffer(1, 400, actx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);
    const s=actx.createBufferSource(), g=actx.createGain(); g.gain.value=0.12;
    s.buffer=b; s.connect(g); g.connect(actx.destination); s.start();
  }catch(e){}
}

/* ---------- slides ---------- */
function rowsOf(st){ return typeof st.rows==="function" ? st.rows() : st.rows; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; if(cycleTimer){clearInterval(cycleTimer); cycleTimer=null;} }

function show(si, sti, animate){
  clearTimers();
  const S=SLIDES[si], st=S.steps[sti];
  const newSlide = si!==cur || !cells.length || cells.length!==rowsOf(st).length;
  cur=si; step=sti;
  if(newSlide){ build(S.cols, rowsOf(st).length); }
  document.getElementById("title").textContent=st.title||S.title;
  meta(S.meta);
  const cap=document.getElementById("cap"), sm=document.getElementById("capsmall");
  if(st.tagline){ cap.innerHTML='<span class="tagline">'+st.tagline+'</span>'; }
  else cap.textContent=(typeof st.cap==="function"?st.cap():st.cap)||"";
  cap.style.fontSize = st.capSize ? st.capSize+"px" : "";
  sm.textContent=(typeof st.small==="function"?st.small():st.small)||"";
  render(rowsOf(st), S.cols, animate);
  if(st.beam && animate){ const b=document.getElementById("beam"); b.classList.remove("go"); void b.offsetWidth; b.classList.add("go"); }
  if(st.cycle){
    let i=0; cycleTimer=setInterval(()=>{ i=(i+1)%CONFIG.nextCustomers.length;
      const last=cells.length-1; const txt=pad(CONFIG.nextCustomers[i], S.cols[1].w);
      cells[last][1].forEach((t,k)=>flipTo(t, txt[k], DIM, k*25, true)); }, 2600);
  }
  document.getElementById("progress").innerHTML = SLIDES.map((_,i)=>'<i class="'+(i===si?'on':'')+'"></i>').join("");
  document.getElementById("notes").innerHTML = S.notes;
}

let clockTimer=null;
function meta(kind){
  const m=document.getElementById("meta");
  if(clockTimer){clearInterval(clockTimer); clockTimer=null;}
  if(kind!=="shift"){ m.innerHTML=""; return; }
  const tick=()=>{
    const ms=new Date(CONFIG.departure)-new Date();
    let left="DEPARTED";
    if(ms>0){ const h=Math.floor(ms/3.6e6), mi=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
      left=[h,mi,s].map(v=>String(v).padStart(2,"0")).join(":"); }
    m.innerHTML='Shipment leaves in <b>'+left+'</b><br>'+CONFIG.metaLine;
  };
  tick(); clockTimer=setInterval(tick,1000);
}

function next(){ const S=SLIDES[cur]; if(step<S.steps.length-1) show(cur,step+1,true); else if(cur<SLIDES.length-1) show(cur+1,0,true); }
function prev(){ if(step>0) show(cur,step-1,true); else if(cur>0){ show(cur-1, SLIDES[cur-1].steps.length-1, true);} }

document.addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown","Enter"].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==="f"||e.key==="F"){ (document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{}); }
  else if(e.key==="n"||e.key==="N"){ const n=document.getElementById("notes"); n.style.display = n.style.display==="block"?"none":"block"; }
  else if(e.key==="s"||e.key==="S"){ sound=!sound; }
});
document.getElementById("stage").addEventListener("click",next);

function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); const st=document.getElementById("stage");
  st.style.transform=`scale(${s}) translate(-50%,-50%)`; st.style.transformOrigin="0 0";
  st.style.left="50%"; st.style.top="50%"; st.style.transform=`translate(-50%,-50%) scale(${s})`; st.style.transformOrigin="50% 50%"; }
addEventListener("resize",fit); fit();
document.fonts.ready.then(()=>show(0,0,true));
</script>
