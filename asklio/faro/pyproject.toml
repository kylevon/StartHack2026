[project]
name = "faro"
version = "0.1.0"
description = "Faro: a continuously running procurement agent with human approvals"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
faro = "faro.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
