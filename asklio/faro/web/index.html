<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Faro</title>
<style>
/* Three parts on one soft surface. Only two things are raised: the approval cards on the left and the chat panel on the right. Everything inside them, and the whole centre, is flat. Light only. */
:root{
  color-scheme:only light;
  --bg:#f1f3f6; --hi:#ffffff; --lo:#dde2e9;
  --ink:#1d1d1f; --ink-2:#3a3a3f; --muted:#66666c; --hair:rgba(29,29,31,.1); --sheet:rgba(255,255,255,.6);
  --accent:#0071e3; --accent-ink:#ffffff;
  --bad:#c9001a; --warn:#a04a00; --ok:#1d7a36;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --raised:5px 5px 14px var(--lo),-5px -5px 14px var(--hi);
  --raised-sm:3px 3px 7px var(--lo),-3px -3px 7px var(--hi);
  --pressed:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:360px minmax(0,1fr) 368px;height:100%;padding:0 16px}

.left{display:flex;flex-direction:column;min-height:0}
/* The list scrolls, and a scrolling box clips at its padding edge. The side padding is what leaves the cards' shadows (5px offset, 14px blur) room to show. */
.left-list{flex:1;min-height:0;overflow:auto;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px}
.auto{flex:none;border-top:1px solid var(--hair);margin:0 22px;padding:12px 0 16px}
.setbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;background:transparent;padding:9px 10px;text-align:left}
.setbtn:hover{background:rgba(29,29,31,.05)}
.setbtn svg,.set-nav svg{width:18px;height:18px;flex:none;color:var(--ink-2)}
.setbtn b{display:block;font-size:14.5px;font-weight:600}
.setbtn span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{flex:none;position:relative;width:46px;height:28px;border:0;border-radius:999px;background:rgba(29,29,31,.16);padding:0;transition:background .18s ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--hi);transition:transform .18s ease}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(29,29,31,.32);display:grid;place-items:center;padding:16px}
.sheet{width:min(940px,100%);height:min(660px,100%);background:var(--hi);border-radius:24px;box-shadow:0 30px 80px rgba(29,29,31,.3);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--hair)}
.sheet-head b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sheet-x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);width:34px;height:34px;border-radius:10px}
.sheet-x:hover{background:rgba(29,29,31,.06);color:var(--ink)}
.sheet-body{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:0}
.set-nav{border-right:1px solid var(--hair);padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.set-nav button{display:flex;align-items:center;gap:11px;border:0;border-radius:12px;background:transparent;padding:9px 11px;font-size:14.5px;font-weight:500;color:var(--ink-2);text-align:left}
.set-nav button:hover{background:rgba(29,29,31,.05)}
.set-nav button.on{background:rgba(29,29,31,.08);color:var(--ink);font-weight:600}
.set-pane{overflow:auto;padding:22px 26px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.set-pane h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
.set-pane .lead{font-size:14px;color:var(--muted);margin-top:4px;max-width:60ch}
.set-pane h4{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.conn-state{flex:none;margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;padding-top:3px}
.conn-state.on{color:var(--ok)}
.set-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:16px 0;border-top:1px solid var(--hair)}
.set-row:first-of-type{border-top:0;padding-top:4px}
.set-row b{font-size:15px;font-weight:600}
.set-row p{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:58ch}
.set-row .row{display:flex;gap:8px;margin-top:10px}
.set-in{font:inherit;font-size:14px;border:1px solid var(--hair);border-radius:10px;padding:8px 11px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.obj{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.obj .n{font-size:13px;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.icon-btn{border:0;background:transparent;border-radius:8px;width:30px;height:30px;font-size:15px;line-height:1;color:var(--muted)}
.icon-btn:hover:not(:disabled){background:rgba(29,29,31,.07);color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default}
.sup{border:1px solid var(--hair);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sup label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.sup .wide{grid-column:1 / -1}
.sup-foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.addline{display:flex;gap:10px}
@media (max-width:700px){.sheet-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.set-nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--hair);overflow-x:auto}.sup{grid-template-columns:minmax(0,1fr)}}
.auto .btn{padding:7px 14px;font-size:13px}
.brand{padding:0 2px 4px}
.brand b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:13px;color:var(--muted)}
.ap{display:block;text-align:left;width:100%;border:0;border-radius:22px;background:var(--bg);padding:15px 17px;box-shadow:var(--raised);transition:box-shadow .18s ease}
.ap.on{box-shadow:var(--pressed)}
.ap b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.ap .why{display:block;font-size:13px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.st{display:block;font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{color:var(--muted);font-weight:500}
.st-you{color:var(--accent);font-weight:600}
.risk{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.risk-blocker{color:var(--ink)} .risk-risk{color:var(--muted)} .risk-info{color:var(--muted);font-weight:500;opacity:.75}
.grp{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px 0;margin-bottom:-6px;text-align:left}
.grp-name{display:flex;align-items:center;gap:6px}
.grp .chev{width:14px;height:14px;line-height:13px;font-size:15px;font-style:normal;color:inherit}
.grp:hover{color:var(--ink)}
.grp.you:hover{color:var(--accent)}
.grp[aria-expanded="false"]{margin-bottom:0}
.grp.you{color:var(--accent)}
.grp.ahead,.grp.ahead:hover{color:var(--warn)}
.grp span{font-weight:600;letter-spacing:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.dot-blocker{background:var(--bad)} .dot-risk{background:#e08a00} .dot-info{background:var(--muted)}
.ap.done{opacity:.62}
.hint{font-size:13px;color:var(--muted);padding:0 6px}

.center{overflow:auto;min-width:0}
.detail{max-width:760px;margin:0 auto;padding:40px 28px 80px;display:flex;flex-direction:column;gap:30px}
.sevline{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sev-blocker{color:var(--ink)} .sev-risk{color:var(--warn)} .sev-info{color:var(--muted)}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15;text-wrap:balance;margin-top:6px}
h2{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.found{font-size:15.5px;color:var(--ink-2);max-width:65ch;white-space:pre-wrap;overflow-wrap:anywhere}
.evidence{display:flex;flex-direction:column;gap:6px;font-size:14px}
.evidence a{overflow-wrap:anywhere}
.evidence img{max-width:min(420px,100%);border-radius:16px;display:block;margin-top:10px}
.quote{background:var(--sheet);border-radius:16px;padding:16px;font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.cap{font-size:12.5px;color:var(--muted)}
.label{font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted)}
tr:last-child td{border-bottom:0}
.letter{background:var(--sheet);border-radius:18px;padding:18px 20px}
.letter-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.letter-top span{overflow-wrap:anywhere;min-width:0}
.subject{font-weight:600;margin-top:12px;overflow-wrap:anywhere}
.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:var(--ink-2);margin-top:8px}
.seg{display:inline-flex;gap:2px;background:rgba(29,29,31,.07);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--hi);color:var(--ink);font-weight:600}
.decide{border-top:1px solid var(--hair);padding-top:28px;display:flex;flex-direction:column;gap:16px}
.decide h2{margin-bottom:0}
.note-in{font:inherit;font-size:14px;width:100%;border:1px solid var(--hair);border-radius:14px;padding:11px 14px;background:var(--sheet);color:var(--ink)}
.act{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border-radius:999px;padding:10px 22px;font-weight:600;font-size:14.5px;white-space:nowrap;border:1px solid var(--hair);background:transparent}
.btn:hover{background:rgba(29,29,31,.05)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:#0064c8}
.verdict{font-size:17px;font-weight:700}
.verdict.approved{color:var(--ok)} .verdict.rejected{color:var(--ink)}
.empty h1{font-size:26px}
.empty p{color:var(--ink-2);margin-top:10px;max-width:56ch}

.right{padding:22px 6px 22px 16px;min-height:0;display:flex}
.chat{flex:1;min-width:0;min-height:0;border-radius:30px;background:var(--bg);box-shadow:var(--raised);display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.chat-head b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.chat-head span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.working .pulse{background:var(--accent)}
@media (prefers-reduced-motion: no-preference){.working .pulse{animation:pulse 1s ease-in-out infinite alternate}}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.chat-close{margin-left:auto;background:transparent;border:0;color:var(--muted);font-size:22px;line-height:1;display:none}
.feed{flex:1;overflow:auto;padding:10px 18px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.bubble{max-width:90%;border-radius:20px;padding:10px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.agent{background:var(--hi);align-self:flex-start;color:var(--ink)}
.rich{white-space:normal}
.rich p{margin:0}
.rich p + p,.rich p + ul,.rich p + ol,.rich ul + p,.rich ol + p{margin-top:8px}
.rich ul,.rich ol{margin:0;padding-left:1.25em}
.rich li{margin:3px 0}
.rich strong,.tl-sum strong,.step strong,.cap strong{font-weight:700;color:var(--ink)}
.bubble.user strong{color:inherit}
.rich code,.tl-sum code{font-family:var(--mono);font-size:.92em;background:rgba(29,29,31,.07);border-radius:5px;padding:0 4px}
.bubble.user{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.step{display:block;width:100%;border:0;background:transparent;padding:0 2px;text-align:left;font-size:13px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.step i{font-style:normal;font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
.step.open{white-space:pre-wrap;color:var(--ink-2)}
.step:hover{color:var(--ink-2)}
.chip{display:inline-flex;align-items:baseline;gap:5px;max-width:100%;border:0;border-radius:999px;background:rgba(29,29,31,.06);padding:3px 10px;font-size:12px;color:var(--ink-2);text-align:left}
.chip i{font-style:normal;color:var(--muted);flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.chip{color:var(--accent);font-weight:600}
button.chip:hover{background:rgba(0,113,227,.12)}
.chip.bad,.chip.bad i{color:var(--ink)}
.chip.good,.chip.good i{color:var(--ok)}
.event{font-size:12px;color:var(--ink-2);font-weight:600;padding:0 4px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:rgba(29,29,31,.06);border-radius:999px;padding:1px 8px;margin-top:6px}
.ask{display:flex;gap:10px;padding:14px 18px 18px;align-items:center}
.ask input{flex:1;min-width:0;font:inherit;font-size:14px;border:0;border-radius:999px;padding:11px 16px;background:var(--hi);color:var(--ink)}
.ask input::placeholder{color:var(--muted)}
.ask button{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700;line-height:1}
.fab{display:none}

@media (max-width:1140px){
  .app{grid-template-columns:330px minmax(0,1fr)}
  .right{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:20;padding:16px}
  .right[data-open="0"]{display:none}
  .chat{box-shadow:0 18px 50px rgba(29,29,31,.28)}
  .chat-close{display:block}
  .fab{display:block;position:fixed;right:18px;bottom:18px;z-index:10;border:0;border-radius:999px;background:var(--bg);color:var(--accent);padding:12px 20px;font-weight:600;box-shadow:var(--raised)}
}
@media (max-width:760px){
  html,body{height:auto}
  .app{display:block;height:auto}
  .left-list{overflow:visible;padding:22px 4px 12px}
  .auto{margin:0 4px}
  .center{overflow:visible}
  .detail{padding:26px 4px 104px}
  h1{font-size:25px}
}

/* centre: view tabs, evidence viewer, messages */
.viewbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 28px 10px;display:flex;justify-content:center}
.viewbar .seg button{padding:5px 18px;font-size:13.5px}
.viewbar .count{margin-left:6px;color:var(--accent);font-weight:700}
.detail{padding-top:18px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--hair);border-radius:12px;background:transparent;padding:7px 12px;font-size:13px;color:var(--ink-2);text-align:left}
.tile:hover{background:rgba(29,29,31,.04)}
.tile.on{border-color:var(--accent);background:var(--hi);color:var(--ink)}
.tile i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:none}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.viewer{margin-top:14px;background:var(--hi);border-radius:18px;padding:16px;min-width:0}
.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.viewer-top span{overflow-wrap:anywhere;min-width:0}
.viewer img{display:block;width:100%;border-radius:10px;border:1px solid var(--hair)}
.viewer img + img{margin-top:12px}
.viewer .scroll{max-height:460px;overflow:auto;border-radius:10px}
.viewer table{font-size:12.5px}
.viewer th{position:sticky;top:0;background:var(--hi);white-space:nowrap}
.viewer td{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.viewer pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:460px;overflow:auto}
.decidebar{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--hair)}
.decidebar > div{max-width:760px;margin:0 auto;padding:14px 28px 16px;display:flex;flex-direction:column;gap:10px}
.decidebar .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.decidebar .note-in{flex:1;min-width:180px}
.linkbtn{border:0;background:transparent;padding:0;color:var(--accent);font-weight:600;font-size:14px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:12px 10px;border-radius:0}
.trow:hover{background:rgba(29,29,31,.03)}
.trow.on{background:var(--hi);border-radius:14px;border-bottom-color:transparent}
.trow b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .why{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow time{font-size:12px;color:var(--muted);white-space:nowrap}
.trow .dot{margin-top:0}
.dot-none{background:transparent}
.msg{background:var(--hi);border-radius:18px;padding:16px 20px;margin-bottom:12px}
.msg.sent{background:var(--sheet)}
.msg .who-line{font-weight:600;font-size:14px}
@media (max-width:760px){.viewbar{padding:14px 4px 8px}.decidebar > div{padding:12px 4px 14px}}

/* next action and history timeline */
.next{background:var(--hi);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.next + .next{margin-top:14px}
.next h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.next .reason{font-size:14px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.next .msg{background:var(--bg);margin-bottom:0}
.next .quote{background:var(--bg)}
.next .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.next .note-in{flex:1;min-width:180px;background:var(--bg)}
.next .next-text{font-size:15px;color:var(--ink);margin-top:6px}
.next.quiet{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.next.quiet .next-text{color:var(--ink-2)}
.timeline{display:flex;flex-direction:column}
.logform{display:flex;gap:10px;align-items:center}
.logform .note-in{flex:1;min-width:0}
.tl{padding:16px 0;border-top:1px solid var(--hair)}
.tl:first-child{border-top:0}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tl time{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;margin-right:8px;white-space:nowrap}
.b-agent{background:rgba(29,29,31,.08);color:var(--ink-2)}
.b-you{background:var(--accent);color:var(--accent-ink)}
.b-out{background:var(--hi);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.b-in{background:#f6dfb4;color:#5f3d00}
.b-done{background:#cfe9d6;color:#14532a}
.b-auto{background:var(--ink);color:var(--hi)}
.tl-did{font-size:12.5px;color:var(--muted)}
.tl-line{display:flex;align-items:flex-start;gap:12px;width:100%;margin-top:8px;padding:0;border:0;background:transparent;text-align:left;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.tl-sum{flex:1;min-width:0;overflow-wrap:anywhere}
.tl-full{font-size:14px;color:var(--ink-2);margin-top:10px;padding:14px 16px;background:var(--hi);border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl .msg{margin:10px 0 0}
.chev{flex:none;display:inline-block;width:22px;height:22px;line-height:20px;text-align:center;font-size:20px;color:var(--muted);transform:rotate(90deg);transition:transform .15s ease}
.chev.up{transform:rotate(-90deg)}
button.tl-line:hover .chev{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <nav class="left" aria-label="Issues">
    <div class="left-list" id="left"></div>
    <div class="auto" id="auto"></div>
  </nav>
  <main class="center" id="center">
    <div class="viewbar" id="viewbar" hidden><div class="seg" role="tablist">
      <button role="tab" id="tab-decision" data-view="decision">Decision</button>
      <button role="tab" id="tab-history" data-view="history">History<span class="count" id="hist-count"></span></button>
    </div></div>
    <div id="view"></div>
  </main>
  <aside class="right" id="right" data-open="0" aria-label="Chat with the agent">
    <div class="chat">
      <div class="chat-head" id="chat-head"><b>Agent</b><span><i class="pulse"></i><em id="status" style="font-style:normal">connecting</em></span>
        <button class="chat-close" id="chat-close" aria-label="Close chat">×</button></div>
      <div class="feed" id="feed"></div>
      <form class="ask" id="ask-form"><input id="ask-input" type="text" placeholder="Message the agent" autocomplete="off" aria-label="Message the agent"><button type="submit" aria-label="Send">↑</button></form>
    </div>
  </aside>
  <button class="fab" id="chat-open">Chat</button>
</div>
<div class="scrim" id="settings" hidden></div>

<script>
const issues = new Map();       // id -> issue, in arrival order
const approvals = new Map();    // id -> approval
const feed = [];
let selected = null, shownKey = null, lastSeq = 0, dirty = false;
let view = 'decision';          // centre tab: 'decision' or 'history'
const evidenceOpen = new Map(); // issue id -> evidence path shown in the viewer
const msgLang = new Map();      // message or draft key -> 'orig' when the reader switched away from English
const sheetOpen = new Map();    // file path -> sheet index
const expanded = new Set();     // history entries the reader opened in full
let shownPlace = '';
let outlook = { scenarios: [], forecast: {} }, outlookStamp = 0;   // what could still go wrong, and where things end up if nothing changes
let lookSel = null, lookTab = 'decision';   // which scenario is open in the centre, and which of its two tabs
let settings = { auto: false, aggressive: false, forecasting: false, objectives: [], suppliers: [], adapters: [] };   // what the team controls
let settingsOpen = false, settingsTab = 'objectives', autoAsk = false;
let historyData = null;         // { id, entries, problem } for the issue on screen

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const stamp = (ts) => new Date(ts * 1000).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
// Text the model wrote for people: escaped, then light markdown. `mdi` is for one line, `md` also does lists and line breaks.
const mdi = (v) => esc(v).replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*\n]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>').replace(/`([^`\n]+?)`/g, '<code>$1</code>');
function md(v) {
  const out = []; let list = null, tag = 'ul', para = [];
  const flush = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } if (list) { out.push('<' + tag + '>' + list.join('') + '</' + tag + '>'); list = null; } };
  for (const line of String(v).split('\n')) {
    const item = /^\s*(?:([-*•])|(\d+)[.)])\s+(.*)$/.exec(line);
    if (item) { if (para.length) flush(); if (!list) { list = []; tag = item[2] ? 'ol' : 'ul'; } list.push('<li>' + mdi(item[3]) + '</li>'); }
    else if (!line.trim()) flush();
    else { if (list) flush(); para.push(mdi(line)); }
  }
  flush();
  return out.join('');
}
// Older text has no emphasis of its own. Ask the server to add some (same words, key facts in bold), once per text.
const richCache = new Map(), richWanted = new Set();
let richTimer = null;
function rich(text) {
  if (!text) return '';
  if (text.length < 80 || text.includes('**')) return md(text);
  if (richCache.has(text)) return md(richCache.get(text));
  richWanted.add(text); clearTimeout(richTimer); richTimer = setTimeout(flushRich, 150);
  return md(text);
}
async function flushRich() {
  const texts = [...richWanted].filter((t) => !richCache.has(t)); richWanted.clear();
  if (!texts.length) return;
  let marked = texts;
  try { const res = await fetch('/api/rich', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texts }) }); if (res.ok) marked = (await res.json()).texts; } catch (err) { /* keep the plain text */ }
  texts.forEach((t, k) => richCache.set(t, marked[k] || t));
  if (marked.some((m, k) => m !== texts[k])) renderCenter(true);
}
const bare = (v) => String(v).replace(/\*\*/g, '');
// The quick version of a long text: whole leading sentences while they fit.
function gist(text, limit = 170) {
  const flat = String(text).replace(/\s+/g, ' ').trim();
  if (flat.length <= limit) return flat;
  let line = '';
  for (const sentence of flat.split(/(?<=[.!?])\s+/)) { if ((line + ' ' + sentence).length > limit) break; line = (line + ' ' + sentence).trim(); }
  return line || flat.slice(0, limit).replace(/\s+\S*$/, '') + '…';
}
const q = (path) => encodeURIComponent(path);
const base = (path) => path.split('/').pop();
const person = (s) => s.replace(/\s*<[^>]*>/, '') || s;
const people = (list) => list.filter((p) => p.includes('<') || !list.some((o) => o !== p && o.includes('<' + p + '>'))).map(person);

const toolTag = { send_email: 'Email', edit_file: 'File edit', update_record: 'Record change' };
function kind(a) {
  if (a.tool === 'send_email') return 'Email to ' + a.args.to_name;
  if (a.tool === 'edit_file') return 'Edit ' + a.args.path;
  return a.args.system + ': ' + a.args.record;
}
const of = (issue) => [...approvals.values()].filter((a) => a.issue_id === issue.id);
// A measure against a scenario is decided on that scenario's card, so it does not also pull its issue into "needs your approval".
const pendingOf = (issue) => of(issue).filter((a) => a.status === 'pending' && !a.scenario_id);
const awaiting = (issue) => issue.thread_ids.length > 0 && issue.replies === 0;
// Who an outside step is waiting on: the name the agent gave, or for older issues the first name it put in bold.
function owner(issue) {
  if (issue.next_owner) return issue.next_owner;
  const names = [...String(issue.next_step || '').matchAll(/\*\*([^*]+)\*\*/g)].map((m) => m[1].trim()).filter((n) => /^[A-Za-zÀ-ž.' -]{3,40}$/.test(n) && /^[A-ZÀ-Ž]/.test(n) && n.split(' ').length <= 4);
  return names[0] || '';
}

// Two different things, shown in two different places.
// Action: who has to do something next. It decides the group a card sits in, and the groups are ordered by how much they need you.
// Risk: how bad the problem is. It is the small word on the card, and orders the cards inside a group.
const GROUPS = ['Needs your approval', 'Waiting on someone else', 'Waiting for a reply', 'Nothing to do', 'Resolved'];
const RISK = { blocker: 0, risk: 1, info: 2 };
function groupOf(issue) {
  if (issue.status === 'resolved') return 4;
  if (pendingOf(issue).length) return 0;
  if (issue.next_step) return 1;
  if (awaiting(issue)) return 2;
  return 3;
}
// The one line under the title: the specifics of what its group already says.
function detail(issue) {
  const waiting = pendingOf(issue);
  if (issue.status === 'resolved') return '';
  if (waiting.length) return waiting.length === 1 ? bare(waiting[0].headline) : waiting.length + ' approvals';
  if (issue.next_step) return owner(issue) || 'Someone outside Faro';
  return '';
}

/* ---------- left: issues, then what could still go wrong ---------- */
const LIKELY = { high: ['Likely', 0], medium: ['Possible', 1], low: ['Unlikely', 2] };
// Which groups of the left column are folded away. A convenience for this browser only.
let folded = new Set();
try { folded = new Set(JSON.parse(localStorage.getItem('faro-folded') || '[]')); } catch (err) { /* private window or blocked storage: everything stays open */ }
function fold(key) {
  if (folded.has(key)) folded.delete(key); else folded.add(key);
  try { localStorage.setItem('faro-folded', JSON.stringify([...folded])); } catch (err) { /* not remembered, still works */ }
  renderLeft();
}
const measures = (x) => [...approvals.values()].filter((a) => a.scenario_id === x.id);
const measuresWaiting = (x) => measures(x).filter((a) => a.status === 'pending');
const watching = () => outlook.scenarios.filter((x) => x.status === 'watching').sort((a, b) => (measuresWaiting(b).length > 0) - (measuresWaiting(a).length > 0) || LIKELY[a.likelihood][1] - LIKELY[b.likelihood][1] || b.created - a.created);
function renderLeft() {
  const list = [...issues.values()].sort((a, b) => groupOf(a) - groupOf(b) || RISK[a.severity] - RISK[b.severity] || b.updated - a.updated);
  const waiting = [...approvals.values()].filter((a) => a.status === 'pending').length;
  let html = '<div class="brand"><b>Faro</b><span>' + (waiting ? waiting + (waiting === 1 ? ' approval waiting' : ' approvals waiting') : 'Nothing is waiting for you') + '</span></div>';
  if (!list.length) html += '<p class="hint">Issues appear here as the agent finds them. Each one keeps its evidence, its next action and its history together.</p>';
  const heading = (key, name, count, you) => '<button class="grp' + (you ? ' you' : '') + '" data-fold="' + key + '" aria-expanded="' + !folded.has(key) + '"><span class="grp-name"><i class="chev' + (folded.has(key) ? '' : ' up') + '" aria-hidden="true">›</i>' + name + '</span><span>' + count + '</span></button>';
  const card = (i, g) => { const line = detail(i); return '<button class="ap ' + (i.id === selected && view !== 'look' ? 'on ' : '') + (g >= 3 ? 'done' : '') + '" data-open="' + i.id + '" title="' + esc(bare(i.title)) + '">' +
    '<span class="risk risk-' + esc(i.severity) + '">' + esc(i.severity) + '</span><b>' + esc(bare(i.title)) + '</b>' + (line ? '<span class="st' + (g === 0 ? ' st-you' : '') + '">' + esc(line) + '</span>' : '') + '</button>'; };
  const section = (g) => { const mine = list.filter((i) => groupOf(i) === g); return mine.length ? heading('g' + g, GROUPS[g], mine.length, g === 0) + (folded.has('g' + g) ? '' : mine.map((i) => card(i, g)).join('')) : ''; };
  html += section(0) + section(1) + section(2);
  // Not issues: nothing has happened yet. Same card as everything else; the group heading and the likelihood word say what they are.
  const ahead = watching();
  if (ahead.length) {
    html += heading('look', 'Could go wrong', ahead.length, false).replace('class="grp"', 'class="grp ahead"');
    if (!folded.has('look')) html += ahead.map((x) => '<button class="ap look ' + (view === 'look' && lookSel === x.id ? 'on' : '') + '" data-look="' + x.id + '" title="' + esc(bare(x.what)) + '">' +
      '<span class="risk risk-' + (x.likelihood === 'high' ? 'blocker' : x.likelihood === 'medium' ? 'risk' : 'info') + '">' + LIKELY[x.likelihood][0] + '</span><b>' + esc(bare(x.what)) + '</b>' + (measuresWaiting(x).length ? '<span class="st st-you">' + esc(bare(measuresWaiting(x)[0].headline)) + '</span>' : measures(x).some((a) => a.outcome === 'done') ? '<span class="st">Reminder sent</span>' : '') + '</button>').join('');
  }
  html += section(3) + section(4);
  $('left').innerHTML = html;
}

const ICON = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  target: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.4"/><circle cx="10" cy="10" r=".6" fill="currentColor"/></svg>',
  people: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7.5" cy="7" r="2.6"/><path d="M2.8 16c.5-2.7 2.3-4.2 4.7-4.2s4.2 1.5 4.7 4.2M13.2 4.6a2.6 2.6 0 010 4.8M14.6 11.9c1.4.5 2.3 1.8 2.6 4.1"/></svg>',
  stack: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><ellipse cx="10" cy="5" rx="6.5" ry="2.5"/><path d="M3.5 5v5c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5V5M3.5 10v5c0 1.4 2.9 2.5 6.5 2.5s6.5-1.1 6.5-2.5v-5"/></svg>',
  bolt: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.5L4.5 11.2h4.4L8 17.5l7-9h-4.5z"/></svg>',
};
const TABS = [['objectives', 'Objectives', 'target'], ['suppliers', 'Suppliers', 'people'], ['connections', 'Connections', 'stack'], ['automation', 'Automation', 'bolt']];
const adapterFor = (system) => (settings.adapters || []).find((a) => a.enabled && String(system || '').toLowerCase().includes(a.system.toLowerCase()));

function renderAuto() {   // the settings button at the bottom of the left column
  const modes = [settings.auto ? 'Auto mode on' : '', settings.aggressive ? 'Aggressive mode on' : '', settings.forecasting ? 'Forecasting on' : '', ...(settings.adapters || []).filter((a) => a.enabled).map((a) => a.system + ' connected')].filter(Boolean).join(' · ');
  $('auto').innerHTML = '<button class="setbtn" id="open-settings">' + ICON.gear + '<span style="min-width:0"><b>Settings</b><span>' + (modes || settings.objectives.length + (settings.objectives.length === 1 ? ' objective' : ' objectives') + ' · ' + settings.suppliers.length + ' suppliers') + '</span></span></button>';
}

function settingsPane() {
  if (settingsTab === 'objectives') {
    const list = settings.objectives;
    return '<div><h3>Objectives</h3><p class="lead">What the agent should achieve, most important first. It follows them in everything it decides and proposes; when two conflict, the higher one wins.</p></div>' +
      '<div>' + (list.length ? list.map((text, i) => '<div class="obj"><span class="n">' + (i + 1) + '</span><input class="set-in" data-obj="' + i + '" value="' + esc(text) + '" aria-label="Objective ' + (i + 1) + '">' +
        '<span><button class="icon-btn" data-obj-move="' + i + '" data-by="-1" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button><button class="icon-btn" data-obj-move="' + i + '" data-by="1" aria-label="Move down"' + (i === list.length - 1 ? ' disabled' : '') + '>↓</button><button class="icon-btn" data-obj-del="' + i + '" aria-label="Remove">✕</button></span></div>').join('')
        : '<p class="cap">No objectives yet. Without any, the agent uses its own judgement about what matters most.</p>') + '</div>' +
      '<form class="addline" id="obj-form"><input class="set-in" id="obj-new" placeholder="Add an objective, e.g. Ship every Collector\'s Edition on Sunday" aria-label="New objective" autocomplete="off"><button class="btn" type="submit">Add</button></form>';
  }
  if (settingsTab === 'suppliers') {
    const field = (i, s, key, label, wide) => '<label' + (wide ? ' class="wide"' : '') + '>' + label + '<input class="set-in" data-sup="' + i + '" data-field="' + key + '" value="' + esc(s[key] || '') + '" autocomplete="off"></label>';
    return '<div><h3>Suppliers</h3><p class="lead">Who the agent writes to, at which address, in which language. The agent fills this in from the documents; anything you change here overrides what it found, and it will not change your entries.</p></div>' +
      (settings.suppliers.length ? settings.suppliers.map((s, i) => '<div class="sup">' + field(i, s, 'name', 'Supplier') + field(i, s, 'contact', 'Contact person') + field(i, s, 'email', 'Email') + field(i, s, 'language', 'Language') + field(i, s, 'notes', 'Notes', true) +
        '<div class="sup-foot"><span class="cap">' + (s.by_team ? 'Edited by you' : 'Added by the agent') + '</span><button class="icon-btn" data-sup-del="' + i + '" aria-label="Remove supplier">✕</button></div></div>').join('')
        : '<p class="cap">No suppliers yet. The agent adds them as it reads the documents.</p>') +
      '<div><button class="btn" id="sup-add">Add a supplier</button></div>';
  }
  if (settingsTab === 'connections') {
    const c = settings.connections || { documents: {}, mailbox: {}, systems: [] };
    const state = (on, yes, no) => '<span class="conn-state' + (on ? ' on' : '') + '">' + (on ? yes : no) + '</span>';
    const d = c.documents, m = c.mailbox;
    const row = (name, purpose, on, control) => '<div class="set-row"><div><b>' + esc(name) + '</b><p>' + purpose + '</p></div>' + state(on, 'Connected', 'Disconnected') + (control || '') + '</div>';
    return '<div><h3>Connections</h3><p class="lead">What Faro reads, and where it posts.</p></div>' +
      '<div><h4>Documents</h4>' + row(d.folder || 'No folder', 'The files Faro reads to find problems. It never changes them.', !!d.folder) + '</div>' +
      '<div><h4>Mailbox</h4>' + row(m.address || 'No mailbox', 'Where approved emails are sent from and replies arrive.', !!(m.address && m.sends)) + '</div>' +
      '<div><h4>Systems of record</h4>' + (c.systems.length ? c.systems.map((x) => row(x.name, x.adapter ? 'Corrections you approve are posted here.' : 'No connector yet. Corrections are kept for someone to enter by hand.', x.enabled,
          x.adapter ? '<button class="switch" data-adapter="' + esc(x.adapter) + '" role="switch" aria-checked="' + x.enabled + '" aria-label="Connect ' + esc(x.name) + '"></button>' : '')).join('')
        : '<p class="cap">None found yet. Faro lists a system once it finds one in your documents.</p>') + '</div>';
  }
  return '<div><h3>Automation</h3><p class="lead">How much the agent does on its own, and how it deals with suppliers.</p></div><div>' +
    '<div class="set-row"><div><b>Auto mode</b><p>' + (autoAsk ? 'Emails and actions the agent marks as routine will go out without you reading them first. Anything that commits money or places an order still waits for you.'
      : 'Routine emails and actions go ahead without asking: questions, status requests, confirmations. Anything that commits money or places an order still waits for your approval.') + '</p>' +
      (autoAsk ? '<div class="row"><button class="btn btn-primary" data-auto="1">Turn on</button><button class="btn" data-auto="cancel">Cancel</button></div>' : '') + '</div>' +
      '<button class="switch" id="sw-auto" role="switch" aria-checked="' + settings.auto + '" aria-label="Auto mode"></button></div>' +
    '<div class="set-row"><div><b>Aggressive mode</b><p>The agent gets ruthless with suppliers. It names every failure and who owns it, plays suppliers against each other where a real alternative exists, holds contract penalties against them, sets deadlines in hours and escalates to their management. It threatens the relationship in your name: cancelled orders, no future projects, volume moved to a competitor. It does not lie: every fact it states comes from the documents or the mailbox. These emails always wait for your approval.</p></div>' +
      '<button class="switch" id="sw-aggr" role="switch" aria-checked="' + settings.aggressive + '" aria-label="Aggressive mode"></button></div>' +
    '<div class="set-row"><div><b>Forecasting</b><p>The agent looks ahead on its own, about every half hour: it takes stock of everything, simulates the rest of the run, and lists what could still go wrong, each with a response ready. These appear under "Could go wrong" in the list. Each look uses the model, so it costs more to run.</p></div>' +
      '<button class="switch" id="sw-forecast" role="switch" aria-checked="' + !!settings.forecasting + '" aria-label="Forecasting"></button></div></div>';
}

function renderSettings() {
  const box = $('settings');
  box.hidden = !settingsOpen;
  if (!settingsOpen) return;
  box.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Settings"><div class="sheet-head"><b>Settings</b><button class="sheet-x" data-close aria-label="Close settings">×</button></div>' +
    '<div class="sheet-body"><nav class="set-nav">' + TABS.map(([id, name, icon]) => '<button class="' + (settingsTab === id ? 'on' : '') + '" data-tab="' + id + '">' + ICON[icon] + name + '</button>').join('') + '</nav>' +
    '<div class="set-pane">' + settingsPane() + '</div></div></div>';
}
function save(patch) { Object.assign(settings, patch); renderAuto(); renderSettings(); post('/api/settings', patch); }

/* ---------- shared pieces ---------- */
function letter(top, subject, original, english, language, key, cls) {
  const en = english && msgLang.get(key) !== 'orig';
  const seg = english ? '<div class="seg"><button class="' + (en ? 'on' : '') + '" data-msg="' + esc(key) + '" data-to="en">English</button><button class="' + (en ? '' : 'on') + '" data-msg="' + esc(key) + '" data-to="orig">' + esc(language || 'Original') + '</button></div>' : '';
  return '<div class="msg ' + (cls || '') + '"><div class="letter-top"><span>' + top + '</span>' + seg + '</div>' + (subject ? '<p class="subject">' + esc(subject) + '</p>' : '') +
    '<div class="body">' + esc(en ? english : original) + '</div></div>';
}

function actionView(a) {
  const x = a.args;
  if (a.tool === 'send_email') {
    const top = 'To ' + esc(x.to_name) + ' · ' + esc(x.to.join(', ')) + (x.cc && x.cc.length ? ' · cc ' + esc(x.cc.join(', ')) : '') + (x.reply_to_message_id ? ' · reply in the existing conversation' : '');
    return letter(top, x.subject, x.body, x.translation, x.language, 'draft-' + a.id, 'sent');
  }
  if (a.tool === 'edit_file') {
    return '<div><p class="label" style="margin-top:0">In ' + esc(x.path) + ', replace</p><pre class="quote">' + esc(x.find) + '</pre><p class="label">with</p><pre class="quote">' + esc(x.replace) + '</pre></div>';
  }
  return '<div><p><b>' + esc(x.system) + '</b> · ' + esc(x.record) + '</p><div class="scroll"><table><thead><tr><th>Field</th><th>' + esc(x.system) + ' says</th><th>Should be</th></tr></thead><tbody>' +
    (Array.isArray(x.changes) ? x.changes : Object.entries(x.changes).map(([field, new_value]) => ({ field, old_value: '', new_value })))
      .map((c) => '<tr><td>' + esc(c.field) + '</td><td>' + esc(c.old_value || 'not recorded') + '</td><td><b>' + esc(c.new_value) + '</b></td></tr>').join('') + '</tbody></table></div></div>';
}

/* ---------- centre: one thing that could go wrong, or the forecast ---------- */
function lookView() {
  const x = outlook.scenarios.find((y) => y.id === lookSel);
  if (!x) return '<div class="detail empty"><div><h1>Nothing selected</h1></div></div>';
  if (lookTab === 'history') {
    return '<div class="detail"><header><div class="sevline sev-info">Could go wrong · ' + x.id + ' · ' + LIKELY[x.likelihood][0] + '</div><h1>' + esc(bare(x.what)) + '</h1>' +
      '<p class="cap" style="margin-top:8px">What was done to prevent this, newest first: the measure, your decision and the emails that followed. Emails are read from the team mailbox.</p></header>' +
      '<section>' + timeline(x.id) + '</section></div>';
  }
  const issue = issues.get(x.issue_id), open = x.status === 'watching';
  return '<div class="detail"><header><div class="sevline sev-info">Could go wrong · ' + x.id + ' · ' + LIKELY[x.likelihood][0] + '</div><h1>' + esc(bare(x.what)) + '</h1>' +
    '<p class="cap" style="margin-top:8px">This has not happened. The aim is that it never does.</p></header>' +
    '<section><h2>What it would cost</h2><div class="found rich">' + rich(x.impact) + '</div></section>' +
    '<section><h2>To prevent it</h2>' + (x.prevention ? '<div class="found rich">' + rich(x.prevention) + '</div>' : '<p class="cap">The agent has not recorded a preventive measure.</p>') +
      measuresWaiting(x).map((a) => '<div style="margin-top:14px">' + approvalCard(a) + '</div>').join('') +
      measures(x).filter((a) => a.status !== 'pending').map((a) => '<p class="cap" style="margin-top:10px">' + (a.status === 'withdrawn' ? 'Withdrawn' : a.status === 'rejected' ? 'Rejected' : a.outcome === 'done' ? (a.auto ? 'Sent by auto mode' : 'Sent') : a.outcome === 'failed' ? 'Sending failed' : 'Approved') + (a.decided ? ' at ' + clock(a.decided) : '') + ': ' + esc(bare(a.headline)) + '</p>').join('') +
      (open && x.prevention && !measures(x).length ? '<p class="cap" style="margin-top:10px">No message has been proposed for this. Either the person has no email address on file, so someone has to tell them, or the agent has not got to it yet.</p>' : '') + '</section>' +
    '<section><h2>Why the agent thinks so</h2><div class="found rich">' + rich(x.why) + '</div></section>' +
    '<section><h2>The sign that it is happening</h2><div class="found rich">' + rich(x.watch_for) + '</div></section>' +
    '<section><h2>If it happens anyway</h2><div class="next quiet"><div class="reason rich next-text" style="margin-top:0">' + rich(x.response) + '</div>' +
      '<p class="cap">The agent proposes this for your approval the moment the scenario happens.</p></div></section>' +
    (issue ? '<section><h2>Belongs to</h2><button class="linkbtn" data-open="' + issue.id + '">' + esc(bare(issue.title)) + '</button></section>' : '') +
    '<section class="decide">' + (open
      ? '<div class="act"><button class="btn" data-settle="' + x.id + '" data-happened="0">No longer a risk</button><span class="cap">Removes it from the list.</span></div>'
      : '<p class="verdict">' + (x.status === 'happened' ? 'This happened' : 'Ruled out') + (x.settled ? ' at ' + clock(x.settled) : '') + '</p>' + (x.note ? '<p class="cap">' + mdi(x.note) + '</p>' : '')) + '</section></div>';
}

function approvalCard(a) {
  return '<div class="next"><div><div class="sevline sev-info">' + toolTag[a.tool] + ' · ' + a.id + '</div><h3>' + esc(bare(a.headline)) + '</h3><div class="reason rich">' + rich(a.reason) + '</div>' + (a.human_reason ? '<p class="cap" style="margin-top:8px">' + (a.needs_human ? 'Needs you: ' : 'Routine, would go ahead in auto mode: ') + mdi(a.human_reason) + '</p>' : '') + '</div>' +
    actionView(a) +
    '<div class="row"><input class="note-in" id="note-' + a.id + '" type="text" placeholder="Optional note to the agent" aria-label="Note to the agent" autocomplete="off">' +
    '<button class="btn" data-decide="0" data-id="' + a.id + '">Reject</button><button class="btn btn-primary" data-decide="1" data-id="' + a.id + '">' + (a.live ? (a.tool === 'send_email' ? 'Approve and send' : 'Approve and post') : 'Approve') + '</button></div>' +
    '<p class="cap">' + (a.live && a.tool === 'send_email' ? 'Approving sends this email straight away from the team mailbox' + (a.args.translation ? ', in ' + esc(a.args.language) : '') + '. It cannot be recalled.'
      : a.live ? 'Approving enters this in the corrections ledger and posts it to ' + esc(a.args.system) + ' through its adapter.'
      : a.tool === 'update_record' ? 'Approving enters this in the corrections ledger. ' + esc(a.args.system) + ' is not connected, so someone has to change it there.'
      : 'Approving only records this action. This kind of action is not connected to an outside system yet.') + '</p></div>';
}

/* ---------- centre: the decision page ---------- */
function nextAction(issue) {
  const waiting = pendingOf(issue);
  const cards = waiting.map(approvalCard).join('');
  // Whatever is next gets the same card: a small label, the thing itself, one line saying what it means for you.
  const card = (label, body, cap, quiet) => '<div class="next' + (quiet ? ' quiet' : '') + '"><div><div class="sevline sev-info">' + label + '</div><div class="reason rich next-text">' + body + '</div></div><p class="cap">' + cap + '</p></div>';
  let other = '';
  if (issue.status === 'resolved') other = card('Nothing to do', 'This issue is resolved.', 'It stays here with its history.', true);
  else if (issue.next_step) other = card('Outside Faro' + (owner(issue) ? ' · waiting on ' + esc(owner(issue)) : ''), rich(issue.next_step),
    'Faro cannot see this happen. Tell it when it has. <button class="btn" style="padding:5px 14px;font-size:12.5px;margin-left:8px" data-done="' + issue.id + '">Mark as done</button>');
  else if (!waiting.length && awaiting(issue)) other = card('Waiting for a reply', 'An email is out and has not been answered yet.', 'Nothing for you to do. The reply will appear in History and the agent will pick it up.', true);
  else if (!waiting.length) other = card('Nothing to do', 'No action is needed right now.', 'The agent will raise one here if that changes.', true);
  return cards + other;
}

function decisionView(issue) {
  if (!issue) return '<div class="detail empty"><div><h1>No issues yet</h1><p>The agent reads the document folder on its own and opens an issue for each problem it finds. It stops and asks here before it sends an email, changes a file or changes a record in another system.</p></div></div>';
  if (!evidenceOpen.has(issue.id) && issue.evidence.length) evidenceOpen.set(issue.id, issue.evidence[0]);
  const open = evidenceOpen.get(issue.id);
  return '<div class="detail">' +
    '<header><div class="sevline sev-' + esc(issue.severity) + '">' + esc(issue.severity) + ' · ' + issue.id + '</div><h1>' + esc(bare(issue.title)) + '</h1></header>' +
    '<section><h2>Why</h2><div class="found rich">' + rich(issue.summary) + '</div></section>' +
    '<section><h2>Next action</h2>' + nextAction(issue) + '</section>' +
    (outlook.scenarios.some((x) => x.issue_id === issue.id && x.status === 'watching') ? '<section><h2>Could go wrong</h2><div class="evidence">' + watching().filter((x) => x.issue_id === issue.id).map((x) => '<button class="linkbtn" style="text-align:left;font-weight:500" data-look="' + x.id + '">' + LIKELY[x.likelihood][0] + ' · ' + esc(bare(x.what)) + '</button>').join('') + '</div></section>' : '') +
    ((issue.corrections || []).length ? '<section><h2>Corrections</h2><div class="scroll"><table><thead><tr><th>Record</th><th>Field</th><th>Was</th><th>Now</th><th></th></tr></thead><tbody>' +
      issue.corrections.map((c) => '<tr><td>' + esc(c.system) + ' · ' + esc(c.record) + '</td><td>' + esc(c.field) + '</td><td>' + esc(c.old_value || 'not recorded') + '</td><td><b>' + esc(c.new_value) + '</b></td><td>' +
        (c.applied_at ? '<span class="cap" title="' + esc(c.applied_note || '') + '">' + (/adapter/.test(c.applied_note || '') ? 'Posted to ' : 'Changed in ') + esc(c.system) + ' ' + esc(stamp(c.applied_at)) + '</span>'
          : adapterFor(c.system) ? '<button class="btn btn-primary" style="padding:5px 12px;font-size:12.5px" data-reconcile="' + c.id + '">Reconcile with ' + esc(c.system) + '</button>'
          : '<button class="btn" style="padding:5px 12px;font-size:12.5px" data-applied="' + c.id + '">Mark as changed in ' + esc(c.system) + '</button>') + '</td></tr>').join('') +
      '</tbody></table></div><p class="cap" style="margin-top:10px">Faro and the agent treat the corrected value as the truth from the moment you approve it. ' + (issue.corrections.some((c) => adapterFor(c.system)) ? 'With the connection on, reconciling posts it to the system and records that in History.' : 'The system itself only changes when someone enters it there, or when you connect it under Settings, Connections.') + '</p></section>' : '') +
    (issue.evidence.length ? '<section><h2>Evidence</h2><div class="tiles">' + issue.evidence.map((p) => '<button class="tile ' + (p === open ? 'on' : '') + '" data-evidence="' + esc(p) + '" title="' + esc(p) + '"><i>' + esc((p.split('.').pop() || 'file').slice(0, 4)) + '</i><span>' + esc(base(p)) + '</span></button>').join('') + '</div>' +
      '<div class="viewer" id="viewer"><p class="cap">Opening…</p></div></section>' : '') +
    '</div>';
}

async function loadEvidence(path) {
  if (!$('viewer')) return;
  const top = '<div class="viewer-top"><span>' + esc(path) + '</span><a href="/api/file?path=' + q(path) + '" target="_blank" rel="noopener">Open the original</a></div>';
  let body;
  try {
    const res = await fetch('/api/preview?path=' + q(path));
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || 'status ' + res.status);
    if (d.kind === 'pages') {
      const n = Math.min(d.pages, 12);
      body = Array.from({ length: n }, (_, i) => '<img loading="lazy" src="/api/page?path=' + q(path) + '&n=' + i + '" alt="' + esc(base(path)) + ', page ' + (i + 1) + '">').join('') +
        (d.pages > n ? '<p class="cap" style="margin-top:10px">Showing the first ' + n + ' of ' + d.pages + ' pages.</p>' : '');
    } else if (d.kind === 'tables') {
      const i = Math.min(sheetOpen.get(path) || 0, d.tables.length - 1), t = d.tables[i];
      const tabs = d.tables.length > 1 ? '<div class="seg" style="margin-bottom:12px;flex-wrap:wrap">' + d.tables.map((s, j) => '<button class="' + (j === i ? 'on' : '') + '" data-sheet="' + j + '" data-path="' + esc(path) + '">' + esc(s.name) + '</button>').join('') + '</div>' : '';
      const [headRow, ...rows] = t.rows.length ? t.rows : [[]];
      body = tabs + '<div class="scroll"><table><thead><tr>' + headRow.map((c) => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map((r) => '<tr>' + r.map((c) => '<td title="' + esc(c) + '">' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' +
        (t.total_rows > t.rows.length ? '<p class="cap" style="margin-top:10px">Showing ' + t.rows.length + ' of ' + t.total_rows + ' rows.</p>' : '');
    } else {
      body = '<pre>' + esc(d.text) + '</pre>' + (d.total_chars > d.text.length ? '<p class="cap" style="margin-top:10px">Showing the first ' + d.text.length + ' of ' + d.total_chars + ' characters.</p>' : '');
    }
  } catch (err) {
    body = '<p class="cap">This file could not be shown: ' + esc(err.message) + '</p>';
  }
  const now = $('viewer');
  if (now && evidenceOpen.get(selected) === path) now.innerHTML = top + body;
}

/* ---------- centre: the history of one issue ---------- */
// Who did it decides the badge: the agent, you, or mail going out and coming in.
const WHAT = {
  found: ['Agent', 'found this', 'agent'], note: ['Agent', 'noted', 'agent'], proposed: ['Agent', 'proposed', 'agent'], resolved: ['Agent', 'resolved it', 'done'], reopened: ['Agent', 'reopened it', 'agent'],
  auto_approved: ['Auto mode', 'approved', 'auto'], auto_sent: ['Auto mode', 'approved and sent', 'auto'],
  step_done: ['You', 'marked the outside step as done', 'you'],
  logged: ['You', 'recorded', 'you'], applied: ['You', 'changed it in the system', 'you'],
  reconciled: ['You', 'reconciled it with the system', 'you'], auto_reconciled: ['Adapter', 'posted the correction', 'auto'],
  withdrawn: ['Agent', 'withdrew its proposal', 'agent'],
  anticipated: ['Agent', 'anticipated', 'agent'], scenario_happened: ['Agent', 'saw it happen', 'agent'], scenario_passed: ['Agent', 'ruled it out', 'agent'],
  team_scenario_happened: ['You', 'said it happened', 'you'], team_scenario_passed: ['You', 'ruled it out', 'you'],
  approved: ['You', 'approved', 'you'], rejected: ['You', 'rejected', 'you'], sent: ['You', 'approved and sent', 'you'], failed: ['You', 'approved, sending failed', 'you'],
  mail_sent: ['Email sent', '', 'out'], mail_received: ['Email received', '', 'in'],
};
// The timeline itself: the same for an issue and for something that could go wrong.
function timeline(id) {
  if (!historyData || historyData.id !== id) return '<p class="cap">Reading the history and the mailbox…</p>';
  return (historyData.problem ? '<p class="cap" style="color:var(--ink);font-weight:600">' + esc(historyData.problem) + ' The entries below are what Faro recorded itself.</p>' : '') +
    '<div class="timeline">' + [...historyData.entries].reverse().map((e) => {
      const [who, did, tone] = WHAT[e.kind] || ['', e.kind, 'agent'];
      const mail = e.kind.startsWith('mail_');
      const key = e.kind + (e.message_id || e.ts);
      const flat = String(e.text).replace(/\s+/g, ' ').trim();
      const short = e.summary || gist(mail ? (e.english || e.text) : e.text);
      const more = mail || bare(short) !== bare(flat);
      const open = more && expanded.has(key);
      const full = !open ? '' : mail
        ? letter(e.kind === 'mail_sent' ? 'To ' + esc(people(e.to).join(', ')) : 'From ' + esc(person(e.from)), e.subject, e.text, e.english, e.language, e.message_id, e.direction) +
          (e.translation_error ? '<p class="cap">Not translated: ' + esc(e.translation_error) + '</p>' : '')
        : '<div class="tl-full rich">' + rich(e.text) + '</div>';
      const rest = mail ? (e.kind === 'mail_sent' ? 'to ' + esc(people(e.to).join(', ')) : 'from ' + esc(person(e.from))) + (e.unfiled ? ' · not filed by the agent yet' : '') : esc(did) + (e.ref ? ' · ' + esc(e.ref) : '');
      const line = '<span class="tl-sum">' + mdi(short) + '</span>' + (more ? '<span class="chev' + (open ? ' up' : '') + '" aria-hidden="true">›</span>' : '');
      return '<div class="tl"><div class="tl-head"><span><span class="badge b-' + tone + '">' + who + '</span><span class="tl-did">' + rest + '</span></span><time>' + esc(stamp(e.ts)) + '</time></div>' +
        (more ? '<button class="tl-line" data-expand="' + esc(key) + '" aria-expanded="' + open + '" title="' + (open ? 'Show less' : 'Show all') + '">' + line + '</button>' : '<div class="tl-line">' + line + '</div>') + full + '</div>';
    }).join('') + '</div>';
}
function historyView(issue) {
  const body = timeline(issue.id);
  return '<div class="detail"><header><div class="sevline sev-' + esc(issue.severity) + '">' + esc(issue.severity) + ' · ' + issue.id + '</div><h1>' + esc(bare(issue.title)) + '</h1>' +
    '<p class="cap" style="margin-top:8px">Everything that happened on this issue, newest first, each as one line. Open an entry to read it in full. Emails are read from the team mailbox.</p></header>' +
    '<form class="logform" data-log="' + issue.id + '"><input class="note-in" id="log-' + issue.id + '" type="text" placeholder="Add something that happened outside Faro: a call, a meeting, a decision" aria-label="Add to the history" autocomplete="off"><button class="btn" type="submit">Add</button></form>' +
    '<section>' + body + '</section></div>';
}
async function loadHistory() {
  const look = view === 'look';
  const id = look ? lookSel : selected;
  if (!id) return;
  let data;
  try {
    const res = await fetch((look ? '/api/scenarios/' : '/api/issues/') + q(id) + '/history');
    data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'status ' + res.status);
  } catch (err) { data = { entries: (issues.get(id) || { history: [] }).history, problem: 'The history could not be read: ' + err.message }; }
  if (id !== (view === 'look' ? lookSel : selected)) return;
  historyData = { id, ...data };
  if (view === 'history' || (view === 'look' && lookTab === 'history')) renderCenter(true);
}

/* ---------- rendering ---------- */
function renderCenter(force) {
  if (view === 'look') {
    const mine = [...approvals.values()].filter((a) => a.scenario_id === lookSel);
    const key = 'look' + lookSel + lookTab + outlookStamp + [...approvals.values()].filter((a) => a.scenario_id).map((a) => a.status + a.outcome).join();
    $('viewbar').hidden = false;
    $('tab-decision').className = lookTab === 'decision' ? 'on' : '';
    $('tab-history').className = lookTab === 'history' ? 'on' : '';
    $('hist-count').textContent = historyData && historyData.id === lookSel ? historyData.entries.length : 1 + mine.length + mine.filter((a) => a.status !== 'pending').length;
    if (!force && key === shownKey) return;
    const keep = shownPlace === 'look' + lookSel + lookTab ? $('center').scrollTop : 0;
    shownKey = key; shownPlace = 'look' + lookSel + lookTab;
    $('view').innerHTML = lookView();
    $('center').scrollTop = keep;
    return;
  }
  const issue = issues.get(selected);
  if (!issue) view = 'decision';
  const key = !issue ? 'empty' : view + issue.id + issue.updated + of(issue).map((a) => a.status + a.outcome).join() + (issue.corrections || []).map((c) => c.applied_at).join() + (settings.adapters || []).map((a) => a.enabled).join() + outlookStamp;
  $('viewbar').hidden = !issue;
  $('tab-decision').className = view === 'decision' ? 'on' : '';
  $('tab-history').className = view === 'history' ? 'on' : '';
  // once the timeline is loaded, count what it actually shows (emails included); until then, what Faro itself recorded
  $('hist-count').textContent = !issue ? '' : historyData && historyData.id === issue.id ? historyData.entries.length : issue.history.length + issue.replies;
  if (!force && key === shownKey) return;   // leave a note field alone while it is being typed in
  const place = view + (issue ? issue.id : '');
  const keep = place === shownPlace ? $('center').scrollTop : 0;   // same issue, same tab: stay where the reader was
  shownPlace = place;
  const notes = [...document.querySelectorAll('.note-in')].map((n) => [n.id, n.value]);
  shownKey = key;
  $('view').innerHTML = !issue ? decisionView(null) : view === 'history' ? historyView(issue) : decisionView(issue);
  notes.forEach(([id, value]) => { const n = $(id); if (n) n.value = value; });
  $('center').scrollTop = keep;
  if (issue && view === 'decision' && evidenceOpen.get(issue.id)) loadEvidence(evidenceOpen.get(issue.id));
}

let feedShown = 0;
function renderFeed() {
  const el = $('feed');
  for (; feedShown < feed.length; feedShown++) {
    const e = feed[feedShown];
    if (e.kind === 'user' || e.kind === 'agent') {
      const div = document.createElement('div');
      div.className = 'bubble ' + e.kind; if (e.kind === 'agent') { div.classList.add('rich'); div.innerHTML = md(e.text); } else div.textContent = e.text; el.appendChild(div);
    } else if (e.kind === 'thought' || e.kind === 'step') {
      const line = document.createElement('button');
      line.className = 'step'; line.type = 'button';
      const tag = document.createElement('i'); tag.textContent = e.kind === 'thought' ? 'Thought' : 'Step';
      const body = document.createElement('span'); body.innerHTML = mdi(e.label);
      line.append(tag, body);
      line.addEventListener('click', () => { const open = line.classList.toggle('open'); body.innerHTML = open ? md(e.text) : mdi(e.label); });
      el.appendChild(line);
    } else if (e.kind === 'error') {
      const div = document.createElement('div');
      div.className = 'event'; div.textContent = clock(e.ts) + ' · ' + e.text; el.appendChild(div);
    } else {
      let row = el.lastElementChild;
      if (!row || !row.classList.contains('chips')) { row = document.createElement('div'); row.className = 'chips'; el.appendChild(row); }
      const chip = document.createElement(e.open ? 'button' : 'span');
      chip.className = 'chip' + (e.tone ? ' ' + e.tone : '');
      chip.title = clock(e.ts) + ' · ' + e.text;
      if (e.open) { chip.dataset.open = e.open; if (e.history) chip.dataset.history = '1'; }
      const verb = document.createElement('i'); verb.textContent = e.verb;
      const label = document.createElement('span'); label.textContent = bare(e.label);
      chip.append(verb, label); row.appendChild(chip);
    }
  }
  el.scrollTop = el.scrollHeight;
}

function render() {
  dirty = false;
  if (!issues.has(selected)) selected = ([...issues.values()].find((i) => pendingOf(i).length) || [...issues.values()][0] || {}).id || null;
  renderLeft(); renderCenter(false); renderFeed();
}
function schedule() { if (!dirty) { dirty = true; requestAnimationFrame(render); } }

let historyTimer = null;
let historyLater = null;
function historyChanged() {
  clearTimeout(historyTimer); historyTimer = setTimeout(loadHistory, 400);
  clearTimeout(historyLater); historyLater = setTimeout(loadHistory, 4000);
}

function apply(e) {
  if (e.seq <= lastSeq) return;   // the stream replays from the start after a reconnect
  lastSeq = e.seq;
  if (e.kind === 'issue') {
    const known = issues.has(e.issue.id);
    issues.set(e.issue.id, e.issue);
    if (!known) feed.push({ kind: 'chip', ts: e.ts, verb: 'Found', label: e.issue.title, text: e.issue.summary, open: e.issue.id });
    if (e.issue.id === selected && live) historyChanged();
  } else if (e.kind === 'approval') {
    const a = e.approval, before = approvals.get(a.id);
    approvals.set(a.id, a);
    if ((a.issue_id === selected || (view === 'look' && a.scenario_id === lookSel)) && live) historyChanged();
    if (!before && a.status === 'pending') feed.push({ kind: 'chip', ts: e.ts, verb: 'Asked', label: a.headline, text: 'Asked for approval ' + a.id + ': ' + kind(a), open: a.issue_id });
    else if (before && before.status === 'pending' && a.status !== 'pending') feed.push({ kind: 'chip', ts: e.ts, verb: a.status === 'withdrawn' ? 'Withdrew' : (a.auto ? 'Auto ' : '') + (a.outcome === 'done' ? (a.auto ? 'sent' : 'Sent') : a.outcome === 'failed' ? (a.auto ? 'failed' : 'Failed') : a.status === 'approved' ? (a.auto ? 'approved' : 'Approved') : 'Rejected'), label: a.headline, text: a.id + ' ' + a.status + (a.note ? ': ' + a.note : ''), open: a.issue_id, history: true, tone: a.status === 'approved' && a.outcome !== 'failed' ? 'good' : 'bad' });
  }
  else if (e.kind === 'auto') { /* from before settings existed; the server's settings are current */ }
  else if (e.kind === 'settings') {
    if (!live) return;   // replayed settings are old; the current ones are fetched from the server
    settings = e.value; renderAuto(); schedule();
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#settings');
    if (settingsOpen && !typing) renderSettings();   // do not pull the form out from under someone typing in it
  }
  else if (e.kind === 'outlook') { if (!live) return; outlook = e.value; outlookStamp++; schedule(); }
  else if (e.kind === 'status') { $('status').textContent = e.value; $('chat-head').classList.toggle('working', e.value === 'working'); }
  else if (e.kind === 'activity' && e.verb === 'Found') { /* the issue event already made this chip */ }
  else { if (e.kind === 'mail' && e.open) e.history = true; feed.push(e); if (e.kind === 'mail' && live) historyChanged(); }
  schedule();
}

const source = new EventSource('/api/events');
let live = false;   // false while the stream replays what happened before the page opened
setTimeout(() => { live = true; }, 1500);
source.onmessage = (m) => apply(JSON.parse(m.data));
source.onopen = () => { if (['connecting', 'disconnected'].includes($('status').textContent)) $('status').textContent = 'idle'; };
source.onerror = () => { $('status').textContent = 'disconnected'; $('chat-head').classList.remove('working'); };

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { const detail = (await res.json().catch(() => ({}))).detail; feed.push({ kind: 'error', ts: Date.now() / 1000, text: detail || 'Request failed (' + res.status + ').' }); schedule(); }
  return res.ok;
}
function show(next) { view = next; renderLeft(); renderCenter(true); loadHistory(); }

document.addEventListener('click', (e) => {
  const t = (sel) => e.target.closest(sel);
  let el;
  if (t('#open-settings')) { settingsOpen = true; autoAsk = false; renderSettings(); return; }
  if (settingsOpen) {
    if (t('[data-close]') || e.target.id === 'settings') { settingsOpen = false; renderSettings(); return; }
    if ((el = t('[data-tab]'))) { settingsTab = el.dataset.tab; autoAsk = false; renderSettings(); return; }
    if (t('#sw-auto')) { if (settings.auto) save({ auto: false }); else { autoAsk = !autoAsk; renderSettings(); } return; }
    if ((el = t('[data-auto]'))) { autoAsk = false; if (el.dataset.auto === '1') save({ auto: true }); else renderSettings(); return; }
    if (t('#sw-aggr')) { save({ aggressive: !settings.aggressive }); return; }
    if (t('#sw-forecast')) { save({ forecasting: !settings.forecasting }); return; }
    if ((el = t('[data-adapter]'))) {
      const on = el.getAttribute('aria-checked') !== 'true', id = el.dataset.adapter;
      settings.adapters = (settings.adapters || []).map((a) => a.id === id ? { ...a, enabled: on } : a);
      if (settings.connections) settings.connections.systems = settings.connections.systems.map((x) => x.adapter === id ? { ...x, enabled: on } : x);
      renderAuto(); renderSettings(); post('/api/settings', { adapters: { [id]: on } }); return;
    }
    if ((el = t('[data-obj-move]'))) { const i = Number(el.dataset.objMove), j = i + Number(el.dataset.by), list = [...settings.objectives]; [list[i], list[j]] = [list[j], list[i]]; save({ objectives: list }); return; }
    if ((el = t('[data-obj-del]'))) { save({ objectives: settings.objectives.filter((_, i) => i !== Number(el.dataset.objDel)) }); return; }
    if ((el = t('[data-sup-del]'))) { save({ suppliers: settings.suppliers.filter((_, i) => i !== Number(el.dataset.supDel)) }); return; }
    if (t('#sup-add')) { settings.suppliers = [...settings.suppliers, { name: '', contact: '', email: '', language: '', notes: '', by_team: true }]; renderSettings(); const added = document.querySelector('[data-sup="' + (settings.suppliers.length - 1) + '"][data-field="name"]'); if (added) added.focus(); return; }
    return;   // nothing behind the overlay reacts while it is open
  }
  if ((el = t('[data-view]'))) { if (view === 'look') { lookTab = el.dataset.view; renderCenter(true); loadHistory(); return; } show(el.dataset.view); return; }
  if ((el = t('[data-open]')) && issues.has(el.dataset.open)) { const wasHistory = view === 'history' || (view === 'look' && lookTab === 'history'); selected = el.dataset.open; historyData = null; show(el.dataset.history || wasHistory ? 'history' : 'decision'); if (matchMedia('(max-width:760px)').matches) $('center').scrollIntoView(); return; }
  if ((el = t('[data-evidence]'))) { evidenceOpen.set(selected, el.dataset.evidence); document.querySelectorAll('.tile').forEach((x) => x.classList.toggle('on', x === el)); $('viewer').innerHTML = '<p class="cap">Opening…</p>'; loadEvidence(el.dataset.evidence); return; }
  if ((el = t('[data-sheet]'))) { sheetOpen.set(el.dataset.path, Number(el.dataset.sheet)); loadEvidence(el.dataset.path); return; }
  if ((el = t('[data-expand]'))) { const k = el.dataset.expand; if (expanded.has(k)) expanded.delete(k); else expanded.add(k); renderCenter(true); return; }
  if ((el = t('[data-msg]'))) { msgLang.set(el.dataset.msg, el.dataset.to); renderCenter(true); return; }
  if ((el = t('[data-fold]'))) { fold(el.dataset.fold); return; }
  if ((el = t('[data-look]'))) { if (view !== 'look' && view === 'history') lookTab = 'history'; lookSel = el.dataset.look; view = 'look'; historyData = null; renderLeft(); renderCenter(true); loadHistory(); if (matchMedia('(max-width:760px)').matches) $('center').scrollIntoView(); return; }
  if ((el = t('[data-settle]'))) { el.disabled = true; post('/api/scenarios/' + el.dataset.settle, { happened: el.dataset.happened === '1' }); return; }
  if ((el = t('[data-done]'))) { el.disabled = true; post('/api/issues/' + el.dataset.done + '/done', {}); return; }
  if ((el = t('[data-reconcile]'))) { el.disabled = true; post('/api/corrections/' + el.dataset.reconcile + '/reconcile', {}); return; }
  if ((el = t('[data-applied]'))) { el.disabled = true; post('/api/corrections/' + el.dataset.applied + '/applied', { text: '' }); return; }
  if ((el = t('[data-decide]'))) { el.disabled = true; const note = $('note-' + el.dataset.id); post('/api/approvals/' + el.dataset.id, { approved: el.dataset.decide === '1', note: note ? note.value : '' }); return; }
  if (t('#chat-open') || t('#chat-close')) $('right').dataset.open = $('right').dataset.open === '1' ? '0' : '1';
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && settingsOpen) { settingsOpen = false; renderSettings(); } });
document.addEventListener('change', (e) => {
  const el = e.target;
  if (!settingsOpen || !el.dataset) return;
  if (el.dataset.obj !== undefined) { const list = [...settings.objectives]; list[Number(el.dataset.obj)] = el.value; save({ objectives: list.filter((x) => x.trim()) }); }
  else if (el.dataset.sup !== undefined) {
    const list = settings.suppliers.map((s) => ({ ...s })); const row = list[Number(el.dataset.sup)];
    row[el.dataset.field] = el.value.trim(); row.by_team = true;
    Object.assign(settings, { suppliers: list }); renderAuto();
    post('/api/settings', { suppliers: list.filter((s) => s.name) });   // a row is only sent once it has a name; the form is left as it is while you tab through it
  }
});
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'obj-form') { e.preventDefault(); const text = $('obj-new').value.trim(); if (text) save({ objectives: [...settings.objectives, text] }); const again = $('obj-new'); if (again) again.focus(); return; }
  const form = e.target.closest('[data-log]');
  if (!form) return;
  e.preventDefault();
  const input = form.querySelector('input'); const text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (!(await post('/api/issues/' + form.dataset.log + '/log', { text }))) input.value = text;
});

$('ask-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = $('ask-input'); const text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (!(await post('/api/chat', { text }))) input.value = text;
});

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    if (!res.ok) return;
    settings = await res.json();
    renderAuto(); schedule();
    try { const o = await fetch('/api/outlook'); if (o.ok) { outlook = await o.json(); outlookStamp++; schedule(); } } catch (err) { /* shown empty */ }
    const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#settings');
    if (settingsOpen && !typing) renderSettings();
  } catch (err) { /* the page still works on its defaults */ }
}
render();
renderAuto();
loadSettings();
setTimeout(loadSettings, 1700);   // once more after the stream has replayed, in case something changed meanwhile
</script>
